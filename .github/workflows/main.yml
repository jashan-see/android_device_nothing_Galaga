name: Compile CMF Phone 2 Pro TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Workspace
      uses: actions/checkout@v4

    - name: Configure Linux Server Cache
      run: |
        sudo apt update
        sudo apt install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y

    - name: Initialize TWRP Source Sync
      run: |
        mkdir twrp && cd twrp
        git config --global user.name "Jashan"
        git config --global user.email "jashan@example.com"
        repo init -u https://github.com -b twrp-14.1 --depth=1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Import CMF Phone 2 Pro Device Tree
      run: |
        cd twrp
        git clone https://github.com device/nothing/Galaga

    - name: Execute Source Compilation Engine
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch lineage_Galaga-eng || lunch omni_Galaga-eng || lunch twrp_Galaga-eng
        mka vendorbootimage -j$(nproc)

    - name: Export Finished Recovery Package
      uses: actions/upload-artifact@v4
      with:
        name: CMF_Phone_2_Pro_TWRP
        path: twrp/out/target/product/Galaga/vendor_boot.img
